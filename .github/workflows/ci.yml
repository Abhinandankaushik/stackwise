name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test and Build Frontend
        run: |
          cd frontend
          npm ci
          npm run test
          npm run build
      - name: Build Backend
        run: |
          cd backend
          npm ci
          npm run build
